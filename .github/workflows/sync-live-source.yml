name: Sync Live Source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-live-source
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sync-live-source]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Pull current live source
        env:
          LIVE_SITE: https://bondbridge-verified-20260813.tabisharshad51.chatgpt.site
        run: |
          curl -fsSL "$LIVE_SITE/source.json" -o source.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path("source.json").read_text(encoding="utf-8"))
          for relative_path, content in package["files"].items():
              if relative_path.startswith(".github/workflows/"):
                  continue
              path = Path(relative_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          Path("source.json").unlink()
          PY

      - name: Commit synced source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Sync live BondBridge source [skip source-sync]"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build GitHub Pages app
        run: npm run build:github-pages

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/github-pages
          force_orphan: true
