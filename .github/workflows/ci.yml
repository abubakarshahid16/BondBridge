name: Kinora checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'overhaul/**', 'feature/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: kinora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source
        run: npm run check
      - name: Build application
        run: npm run build
      - name: Build GitHub Pages package
        run: npm run build:github-pages
      - name: Check generated package
        shell: bash
        run: |
          test -d dist/github-pages

