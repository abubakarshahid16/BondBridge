name: Deploy BondBridge PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror live BondBridge app
        env:
          LIVE_SITE: https://bondbridge-verified-20260813.tabisharshad51.chatgpt.site
        run: |
          set -euo pipefail
          mkdir -p public

          curl -fsSL "$LIVE_SITE/" -o public/index.html
          curl -fsSL "$LIVE_SITE/styles.css" -o public/styles.css
          curl -fsSL "$LIVE_SITE/app.js" -o public/app.js
          curl -fsSL "$LIVE_SITE/manifest" -o public/manifest.webmanifest
          curl -fsSL "$LIVE_SITE/service-worker" -o public/sw.js
          curl -fsSL "$LIVE_SITE/app-icon" -o public/icon.svg

          python3 - <<'PY'
          from pathlib import Path

          live_site = "https://bondbridge-verified-20260813.tabisharshad51.chatgpt.site"

          index = Path("public/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace('href="/manifest"', 'href="./manifest.webmanifest"')
          html = html.replace('href="/app-icon"', 'href="./icon.svg"')
          html = html.replace(
              '<script src="./app.js"></script>',
              f'<script>window.BONDBRIDGE_API_BASE = "{live_site}";</script>\n    <script src="./app.js"></script>',
          )
          index.write_text(html, encoding="utf-8")

          app_js = Path("public/app.js")
          js = app_js.read_text(encoding="utf-8")
          js = js.replace('navigator.serviceWorker.register("/service-worker")', 'navigator.serviceWorker.register("./sw.js")')
          app_js.write_text(js, encoding="utf-8")
          PY

          touch public/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true

      - name: Enable GitHub Pages from gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          body='{"source":{"branch":"gh-pages","path":"/"}}'
          status=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages" \
            -d "$body")
          if [ "$status" = "201" ] || [ "$status" = "204" ]; then
            cat response.json
            exit 0
          fi
          if [ "$status" = "409" ] || [ "$status" = "422" ]; then
            curl -fsS \
              -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pages" \
              -d "$body"
            exit 0
          fi
          cat response.json
          echo "Unexpected Pages API status: $status" >&2
          exit 1
