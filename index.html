  <body>
    <!-- No class here on purpose: render() in app.js decides per-view whether
         #app is a full-screen layout (landing/auth) or the app-shell grid.
         Hardcoding "app-shell" here previously trapped the landing/auth
         pages inside the grid's narrow center column on every screen size. -->
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Supabase config. The publishable key is safe in public code —
         Row Level Security is what actually protects the data. -->
    <script>
      window.KINORA_SUPABASE_URL = "https://fpbodwjgypxzqpstwcvo.supabase.co";
      window.KINORA_SUPABASE_KEY = "sb_publishable_nLwhMDYKDfAY_OP-o3c-iA_LJtQ2Ai_";
      window.KINORA_AI_URL = "https://fpbodwjgypxzqpstwcvo.supabase.co/functions/v1/coach";
      // Same Edge Function as above — it also hands out short-lived TURN
      // credentials (see the coach function's "turn-credentials" type) once
      // a TURN provider API key is added as a secret. Falls back to
      // STUN-only automatically if that secret isn't set yet.
      window.KINORA_TURN_URL = "https://fpbodwjgypxzqpstwcvo.supabase.co/functions/v1/coach";
      // Public VAPID key for Web Push — safe to publish (it's the whole
      // point of a "public" key). It lets this browser register for push
      // notifications that keep working after the app/tab is closed.
      window.KINORA_VAPID_PUBLIC_KEY = "BIUVUzbmU8PWZk3geucsRCo_6L7tQRqSD2dajE3D6FLGG4EM9alp9mhHDvDTIsBLjAEHdZDiwzh173geQmmHnRo";
      window.BONDBRIDGE_SUPABASE_URL = window.KINORA_SUPABASE_URL;
      window.BONDBRIDGE_SUPABASE_KEY = window.KINORA_SUPABASE_KEY;
      window.BONDBRIDGE_AI_URL = window.KINORA_AI_URL;
      window.BONDBRIDGE_TURN_URL = window.KINORA_TURN_URL;
      window.BONDBRIDGE_VAPID_PUBLIC_KEY = window.KINORA_VAPID_PUBLIC_KEY;
    </script>
    <!-- Bundled locally rather than loaded from a CDN, so the app still works
         if the CDN is blocked, slow, or down. -->
    <script src="./supabase-lib.js"></script>
    <script src="./config.js?v1787266737"></script>
    <script src="./app.js?v1787266737"></script>
